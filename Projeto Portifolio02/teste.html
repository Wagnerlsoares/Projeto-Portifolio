<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro Moderno</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fonte Inter do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }

        /* Efeito de Glassmorphism no Cartão Principal */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.125);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Estilização personalizada dos Inputs */
        .custom-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-input:focus {
            background: rgba(15, 23, 42, 0.85);
            border-color: #818cf8;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
            outline: none;
        }

        .custom-input::placeholder {
            color: #94a3b8;
        }

        /* Estados de Erro e Sucesso */
        .input-error {
            border-color: #f87171 !important;
            box-shadow: 0 0 10px rgba(248, 113, 113, 0.3) !important;
        }

        .input-success {
            border-color: #34d399 !important;
        }

        /* Custom Scrollbar para Textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Animação do Toast de Notificação */
        @keyframes slideIn {
            from { transform: translateY(-100%) translateX(-50%); opacity: 0; }
            to { transform: translateY(0) translateX(-50%); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateY(0) translateX(-50%); opacity: 1; }
            to { transform: translateY(-100%) translateX(-50%); opacity: 0; }
        }
        .toast-show {
            animation: slideIn 0.4s ease forwards;
        }
        .toast-hide {
            animation: slideOut 0.4s ease forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8 text-slate-100 relative">

    <!-- Toast de Notificação -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden max-w-md w-full px-4">
        <div class="bg-emerald-600/90 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl flex items-center justify-between border border-emerald-400/30">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-full flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-check text-xl text-white"></i>
                </div>
                <div>
                    <h4 class="font-bold text-sm" id="toast-title">Sucesso!</h4>
                    <p class="text-xs text-emerald-100" id="toast-message">Formulário enviado com sucesso.</p>
                </div>
            </div>
            <button onclick="hideToast()" class="text-white/80 hover:text-white transition-colors p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
    </div>

    <div class="max-w-3xl w-full glass-card rounded-3xl p-6 sm:p-10 my-auto">
        
        <!-- Cabeçalho do Formulário -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/30 border border-indigo-400/30 text-indigo-400 mb-4 shadow-lg">
                <i class="fa-solid fa-user-plus text-2xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">Criar Nova Conta</h2>
            <p class="mt-2 text-sm text-slate-400">Preencha os campos abaixo para concluir seu cadastro na plataforma.</p>
        </div>

        <!-- Formulário -->
        <form id="registrationForm" class="space-y-6" novalidate>

            <!-- Seção de Upload de Foto de Perfil -->
            <div class="flex flex-col items-center justify-center space-y-3 pb-2">
                <label class="block text-sm font-medium text-slate-300 text-center">Foto de Perfil</label>
                <div class="relative group">
                    <div id="avatarPreview" class="w-24 h-24 rounded-full bg-slate-800/80 border-2 border-dashed border-slate-600 flex items-center justify-center overflow-hidden transition-all group-hover:border-indigo-400">
                        <i class="fa-solid fa-camera text-2xl text-slate-500 group-hover:text-indigo-400 transition-colors" id="avatarPlaceholder"></i>
                        <img id="avatarImg" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                    </div>
                    <label for="avatar" class="absolute bottom-0 right-0 bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-full cursor-pointer shadow-lg transition-transform hover:scale-110">
                        <i class="fa-solid fa-pen text-xs"></i>
                        <input type="file" id="avatar" name="avatar" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                    </label>
                </div>
                <span class="text-xs text-slate-400">PNG, JPG ou GIF até 5MB</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Nome Completo -->
                <div>
                    <label for="fullname" class="block text-sm font-medium text-slate-300 mb-2">
                        Nome Completo <span class="text-indigo-400">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input type="text" id="fullname" name="fullname" class="custom-input w-full pl-10 pr-4 py-3 rounded-xl text-sm" placeholder="Ex: João da Silva" required>
                    </div>
                    <p class="mt-1.5 text-xs text-red-400 hidden" id="fullname-error"></p>
                </div>

                <!-- E-mail -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-2">
                        E-mail <span class="text-indigo-400">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input type="email" id="email" name="email" class="custom-input w-full pl-10 pr-4 py-3 rounded-xl text-sm" placeholder="seunome@exemplo.com" required>
                    </div>
                    <p class="mt-1.5 text-xs text-red-400 hidden" id="email-error"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Senha com Olho para Alternar Visibilidade -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
                        Senha <span class="text-indigo-400">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="password" name="password" class="custom-input w-full pl-10 pr-10 py-3 rounded-xl text-sm" placeholder="••••••••" required>
                        <button type="button" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors">
                            <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                    <p class="mt-1.5 text-xs text-red-400 hidden" id="password-error"></p>
                </div>

                <!-- Telefone/Celular com Máscara Automática -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-slate-300 mb-2">
                        Telefone / Celular <span class="text-indigo-400">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <input type="tel" id="phone" name="phone" maxlength="15" class="custom-input w-full pl-10 pr-4 py-3 rounded-xl text-sm" placeholder="(00) 00000-0000" required>
                    </div>
                    <p class="mt-1.5 text-xs text-red-400 hidden" id="phone-error"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Data de Nascimento -->
                <div>
                    <label for="birthdate" class="block text-sm font-medium text-slate-300 mb-2">
                        Data de Nascimento <span class="text-indigo-400">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-calendar"></i>
                        </div>
                        <input type="date" id="birthdate" name="birthdate" class="custom-input w-full pl-10 pr-4 py-3 rounded-xl text-sm [color-scheme:dark]" required>
                    </div>
                    <p class="mt-1.5 text-xs text-red-400 hidden" id="birthdate-error"></p>
                </div>

                <!-- Gênero (Radio Buttons) -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        Gênero <span class="text-indigo-400">*</span>
                    </label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="flex items-center justify-center p-3 rounded-xl custom-input cursor-pointer hover:border-indigo-400 transition-colors">
                            <input type="radio" name="gender" value="masculino" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 bg-slate-800 border-slate-600">
                            <span class="ml-2 text-xs font-medium text-slate-300">Masculino</span>
                        </label>
                        <label class="flex items-center justify-center p-3 rounded-xl custom-input cursor-pointer hover:border-indigo-400 transition-colors">
                            <input type="radio" name="gender" value="feminino" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 bg-slate-800 border-slate-600">
                            <span class="ml-2 text-xs font-medium text-slate-300">Feminino</span>
                        </label>
                        <label class="flex items-center justify-center p-3 rounded-xl custom-input cursor-pointer hover:border-indigo-400 transition-colors">
                            <input type="radio" name="gender" value="outro" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 bg-slate-800 border-slate-600">
                            <span class="ml-2 text-xs font-medium text-slate-300">Outro</span>
                        </label>
                    </div>
                    <p class="mt-1.5 text-xs text-red-400 hidden" id="gender-error"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Estado (UF) -->
                <div>
                    <label for="state" class="block text-sm font-medium text-slate-300 mb-2">
                        Estado <span class="text-indigo-400">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </div>
                        <select id="state" name="state" onchange="handleStateChange()" class="custom-input w-full pl-10 pr-4 py-3 rounded-xl text-sm appearance-none cursor-pointer" required>
                            <option value="" disabled selected>Selecione um Estado</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PR">Paraná</option>
                            <option value="RS">Rio Grande do Sul</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                    <p class="mt-1.5 text-xs text-red-400 hidden" id="state-error"></p>
                </div>

                <!-- Cidade (Carregada Dinamicamente) -->
                <div>
                    <label for="city" class="block text-sm font-medium text-slate-300 mb-2">
                        Cidade <span class="text-indigo-400">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-city"></i>
                        </div>
                        <select id="city" name="city" class="custom-input w-full pl-10 pr-4 py-3 rounded-xl text-sm appearance-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" disabled required>
                            <option value="" disabled selected>Selecione o estado primeiro</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                    <p class="mt-1.5 text-xs text-red-400 hidden" id="city-error"></p>
                </div>
            </div>

            <!-- Mensagem / Biografia -->
            <div>
                <label for="bio" class="block text-sm font-medium text-slate-300 mb-2">
                    Biografia ou Apresentação
                </label>
                <div class="relative">
                    <textarea id="bio" name="bio" rows="4" maxlength="300" oninput="updateCharCount()" class="custom-input w-full p-4 rounded-xl text-sm" placeholder="Conte um pouco sobre você, seus interesses e objetivos..."></textarea>
                    <div class="absolute bottom-3 right-3 text-xs text-slate-400 bg-slate-900/80 px-2 py-1 rounded-md">
                        <span id="charCount">0</span>/300
                    </div>
                </div>
            </div>

            <!-- Termos de Uso -->
            <div>
                <label class="flex items-start cursor-pointer">
                    <div class="flex items-center h-5">
                        <input type="checkbox" id="terms" name="terms" class="w-4 h-4 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 bg-slate-900 cursor-pointer" required>
                    </div>
                    <div class="ml-3 text-xs text-slate-300">
                        Eu li e aceito os <a href="#" onclick="alert('Estes são os termos fictícios do serviço.'); return false;" class="text-indigo-400 underline hover:text-indigo-300">Termos de Uso</a> e a <a href="#" onclick="alert('Sua privacidade está protegida.'); return false;" class="text-indigo-400 underline hover:text-indigo-300">Política de Privacidade</a>. <span class="text-indigo-400">*</span>
                    </div>
                </label>
                <p class="mt-1.5 text-xs text-red-400 hidden" id="terms-error"></p>
            </div>

            <!-- Botões de Ação -->
            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                <!-- Botão Limpar -->
                <button type="button" onclick="resetForm()" class="w-full sm:w-1/3 py-3.5 px-4 rounded-xl font-medium text-slate-300 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-600 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left text-xs"></i>
                    <span>Limpar</span>
                </button>

                <!-- Botão Enviar -->
                <button type="submit" id="btnSubmit" class="w-full sm:w-2/3 py-3.5 px-4 rounded-xl font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 shadow-lg shadow-indigo-500/25 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                    <span>Cadastrar Conta</span>
                </button>
            </div>

        </form>
    </div>

    <script>
        // Mapeamento de Cidades por Estado (Simulação de API)
        const citiesByState = {
            'SP': ['São Paulo', 'Campinas', 'Santos', 'Ribeirão Preto', 'Sorocaba'],
            'RJ': ['Rio de Janeiro', 'Niterói', 'Petrópolis', 'Nova Iguaçu', 'Cabo Frio'],
            'MG': ['Belo Horizonte', 'Uberlândia', 'Juiz de Fora', 'Ouro Preto', 'Montes Claros'],
            'PR': ['Curitiba', 'Londrina', 'Maringá', 'Cascavel', 'Foz do Iguaçu'],
            'RS': ['Porto Alegre', 'Caxias do Sul', 'Pelotas', 'Canoas', 'Santa Maria']
        };

        // --- MÁSCARA AUTOMÁTICA DE TELEFONE ---
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });

        // --- ALTERNÂNCIA DE VISIBILIDADE DA SENHA ---
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            c
